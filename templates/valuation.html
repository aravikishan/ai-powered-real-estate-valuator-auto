<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Valuation</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/properties">Properties</a>
            <a href="/valuation">Valuation</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>
    <main class="container">
        <h1 class="primary">Property Valuation</h1>
        <form id="valuation-form">
            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" required>
            </div>
            <div class="mb-3">
                <label for="features" class="form-label">Features (JSON)</label>
                <textarea class="form-control" id="features" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" class="form-control" id="price" required>
            </div>
            <button type="submit" class="btn btn-primary">Get Valuation</button>
        </form>
        <div id="valuation-result" class="mt-4"></div>
    </main>
    <footer>
        <p>&copy; 2023 AI-Powered Real Estate Valuator</p>
    </footer>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('valuation-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const location = document.getElementById('location').value;
            const features = JSON.parse(document.getElementById('features').value);
            const price = parseFloat(document.getElementById('price').value);

            const response = await fetch('/api/properties', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ location, features, price })
            });

            const data = await response.json();
            document.getElementById('valuation-result').innerHTML = `<h3>Valuation: $${data.valuation.toFixed(2)}</h3>`;
        });
    </script>
</body>
</html>
